name: Native and Python Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'kidi-agent/**'
      - 'kidi-ops/**'
      - 'src/kidi/**'
      - 'third_party/**'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/kidi/**'
      - 'tests/CMakeLists.txt'
      - 'tests/data/**'
      - 'tests/*_test.py'
      - 'benchmarks/cuda/run.py'
      - 'benchmarks/cpu/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'kidi-agent/**'
      - 'kidi-ops/**'
      - 'src/kidi/**'
      - 'third_party/**'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/kidi/**'
      - 'tests/CMakeLists.txt'
      - 'tests/data/**'
      - 'tests/*_test.py'
      - 'benchmarks/cuda/run.py'
      - 'benchmarks/cpu/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 / Apple Clang
            os: macos-26
            cc: clang
            cxx: clang++
            cache-id: macos26-clang
          - name: Linux x64 / GCC 14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cache-id: ubuntu2404-gcc14
          - name: Linux ARM64 / GCC 14
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
            cache-id: ubuntu2404-gcc14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-native
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CTEST_PARALLEL_LEVEL: '3'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache gcc-14 g++-14

      - name: Restore compiled objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache-id }}-${{ github.sha }}
          restore-keys: |
            native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache-id }}-

      # One Release build serves the wheel and the tests: the wheel build configures build-ci with tests enabled and
      # compiles the library, and the test programs then link against the same objects.
      - name: Build Python wheel
        run: |
          ccache --zero-stats
          python -m pip install "scikit-build-core>=0.12" "nanobind>=2.4"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist \
            -C build-dir=build-ci -C cmake.define.KIDI_BUILD_TESTS=ON -C cmake.define.BUILD_TESTING=ON

      - name: Build native unit tests
        run: cmake --build build-ci

      # Saved before the tests run, so later runs reuse compiled objects even when a test fails.
      - name: Save compiled objects
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache-id }}-${{ github.sha }}

      - name: Run native unit tests
        # These runners have no GPUs; the CUDA-labeled tests require GPU resources.
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error -LE cuda

      - name: Install Python wheel
        shell: bash
        run: |
          wheels=(dist/kidi-*.whl)
          python -m pip install "${wheels[0]}[hf]"

      - name: Test installed Python package without model downloads
        run: python -m unittest discover -s tests -p '*_test.py'

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats