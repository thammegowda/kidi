name: Native and Python Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/kidi/**'
      - 'third_party/**'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/kidi/**'
      - 'tests/data/**'
      - 'tests/python_cli_test.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - '.gitmodules'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/kidi/**'
      - 'third_party/**'
      - 'python/**'
      - 'pyproject.toml'
      - 'tests/kidi/**'
      - 'tests/data/**'
      - 'tests/python_cli_test.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-native
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      # macOS arm64 runners have 3 cores: build and test with all of them.
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      CTEST_PARALLEL_LEVEL: '3'
      CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: brew install ninja ccache

      - name: Restore compiled objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-macos26-${{ github.sha }}
          restore-keys: |
            native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-macos26-

      # One Release build serves the wheel and the tests: the wheel build configures build-ci with tests enabled and
      # compiles the library, and the test programs then link against the same objects.
      - name: Build Python wheel
        run: |
          ccache --zero-stats
          python -m pip install "scikit-build-core>=0.12" "nanobind>=2.4"
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist \
            -C build-dir=build-ci -C cmake.define.KIDI_BUILD_TESTS=ON -C cmake.define.BUILD_TESTING=ON

      - name: Build native unit tests
        run: cmake --build build-ci

      # Saved before the tests run, so later runs reuse compiled objects even when a test fails.
      - name: Save compiled objects
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-v2-${{ runner.os }}-${{ runner.arch }}-macos26-${{ github.sha }}

      - name: Run native unit tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Install Python wheel
        shell: bash
        run: |
          wheels=(dist/kidi-*.whl)
          python -m pip install "${wheels[0]}[hf]"

      - name: Test installed Python package without model downloads
        run: python -m unittest discover -s tests -p python_cli_test.py

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats