<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title description">
  <title id="title">Kidi Kannada ki flame logo</title>
  <desc id="description">The Kannada syllable ki, ಕಿ, drawn as a glowing orange flame.</desc>
  <defs>
    <linearGradient id="fire" x1="22%" y1="92%" x2="78%" y2="7%">
      <stop offset="0" stop-color="#e73512"/>
      <stop offset=".32" stop-color="#ff5a12"/>
      <stop offset=".67" stop-color="#ff981d"/>
      <stop offset="1" stop-color="#ffe05b"/>
    </linearGradient>
    <linearGradient id="hot" x1="18%" y1="80%" x2="82%" y2="12%">
      <stop offset="0" stop-color="#ff4b12"/>
      <stop offset=".58" stop-color="#ffad22"/>
      <stop offset="1" stop-color="#fff18a"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#d82b12"/>
      <stop offset=".55" stop-color="#ff6815"/>
      <stop offset="1" stop-color="#ffc43b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 .28  0 .38 0 0 .04  0 0 .08 0 0  0 0 0 .88 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- The horizontal bar and lower loop retain the recognizable structure of Kannada ಕ. -->
    <path d="M126 218 H211 L193 246 H145 Z" fill="url(#ember)"/>
    <path d="M304 218 H392 L373 246 H327 Z" fill="url(#hot)"/>

    <!-- Lower loop: a broken circular flame whose opening feeds the central sweep. -->
    <path d="M289 224
             C355 230 397 278 394 341
             C390 411 341 452 276 451
             C214 450 171 414 161 363
             C155 330 164 301 184 277"
          fill="none" stroke="#d93614" stroke-width="39" stroke-linecap="round"/>
    <path d="M290 224
             C348 232 381 278 377 338
             C373 394 334 431 279 431
             C229 431 193 402 181 362
             C171 327 181 301 199 281"
          fill="none" stroke="url(#fire)" stroke-width="27" stroke-linecap="round"/>
    <path d="M307 240
             C349 255 365 292 362 338
             C359 382 329 410 288 413"
          fill="none" stroke="#ffd65a" stroke-opacity=".75" stroke-width="7"
          stroke-linecap="round"/>

    <!-- The main S-shaped ribbon, tapered at both ends. -->
    <path d="M305 100
             C337 137 331 183 302 222
             C278 254 238 278 218 314
             C193 359 204 411 247 455
             C188 436 152 397 151 347
             C149 296 182 260 219 228
             C266 188 304 153 305 100 Z"
          fill="url(#fire)"/>
    <path d="M294 128
             C304 166 278 198 244 230
             C210 261 179 294 174 333
             C171 360 180 383 195 404
             C171 383 161 358 164 333
             C169 291 203 258 236 229
             C272 196 296 166 294 128 Z"
          fill="#ffcf46" fill-opacity=".82"/>
    <path d="M310 119
             C316 156 293 188 257 223
             C225 254 198 286 190 320"
          fill="none" stroke="#fff08b" stroke-width="7" stroke-linecap="round"
          stroke-opacity=".84"/>

    <!-- The upper flame curls into the vowel sign that turns ಕ (ka) into ಕಿ (ki). -->
    <path d="M274 61
             C250 91 258 111 239 126
             C242 105 225 95 239 73
             C210 98 204 132 223 151
             C246 174 282 161 292 137
             C305 107 280 91 286 72
             C298 91 311 111 309 134
             C306 172 277 195 247 191
             C207 187 188 153 197 121
             C204 94 228 77 274 61 Z"
          fill="url(#fire)"/>
    <path d="M256 111
             C278 110 291 130 284 149
             C278 165 259 173 244 163
             C231 154 231 136 243 127
             C252 120 264 123 268 132"
          fill="none" stroke="#9f2515" stroke-width="13" stroke-linecap="round"/>
    <path d="M272 74 C258 98 264 117 252 126"
          fill="none" stroke="#fff184" stroke-width="7" stroke-linecap="round"/>

    <!-- Small side flames. -->
    <path d="M151 296 C130 316 132 346 151 364 C145 341 160 328 151 296 Z" fill="url(#ember)"/>
    <path d="M139 337 C116 354 123 382 147 393 C134 374 153 359 139 337 Z" fill="#f04a14"/>
    <path d="M388 294 C408 313 405 340 389 355 C395 335 380 321 388 294 Z" fill="url(#hot)"/>
    <path d="M402 338 C421 354 414 379 393 391 C405 373 389 357 402 338 Z" fill="#f45114"/>
  </g>

  <!-- Highlights keep the symbol crisp when rendered as a small icon. -->
  <g fill="#ffc13c" filter="url(#soft-glow)">
    <circle cx="174" cy="176" r="4"/>
    <circle cx="359" cy="165" r="3.2"/>
    <circle cx="384" cy="190" r="2.4"/>
    <circle cx="145" cy="266" r="2.7"/>
    <circle cx="365" cy="278" r="2.2"/>
    <circle cx="218" cy="82" r="2.5"/>
  </g>
  <g fill="none" stroke="#ff8e1c" stroke-width="3" stroke-linecap="round">
    <path d="M164 191 l-8 -10"/>
    <path d="M179 156 l-4 -12"/>
    <path d="M342 130 l6 -13"/>
    <path d="M367 147 l11 -8"/>
    <path d="M130 283 l-10 -5"/>
    <path d="M399 264 l10 -7"/>
  </g>
</svg>
